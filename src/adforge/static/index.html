<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdForge | Grounded campaign generator</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#e7eefb;background:#0b1020}
    *{box-sizing:border-box}body{margin:0}main{width:min(1100px,calc(100% - 32px));margin:auto;padding:28px 0 64px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.brand{font-size:1.4rem;font-weight:800}.brand span{color:#7dd3fc}
    a{color:#7dd3fc}.hero{padding:28px 0}.hero h1{font-size:clamp(2rem,6vw,4.5rem);line-height:1;margin:0 0 16px}.muted{color:#a9b8d2;line-height:1.6}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.panel{background:#121d33;border:1px solid #2a3a58;border-radius:16px;padding:22px;margin-top:18px}
    label{display:block;color:#a9b8d2;font-size:.9rem;margin:12px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #385072;border-radius:8px;background:#0b1020;color:#fff;font:inherit}
    textarea{min-height:84px;resize:vertical}.button{border:0;border-radius:8px;padding:12px 18px;background:#7dd3fc;color:#06111f;font-weight:800;cursor:pointer;margin-top:16px}
    .button.secondary{background:#233451;color:#fff}.status{margin-top:14px;min-height:1.3em}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tab{background:#233451;color:#fff;border:0;border-radius:7px;padding:9px;cursor:pointer}.tab.active{background:#7dd3fc;color:#06111f}
    #output{line-height:1.6;color:#dbeafe}.content-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.content-card{background:#0b1528;border:1px solid #2a3a58;border-radius:12px;padding:16px}.content-card h3{margin:0 0 8px;color:#fff}.content-card h4{margin:14px 0 4px;color:#7dd3fc}.content-card p{margin:6px 0}.content-card ul{margin:8px 0;padding-left:22px}.visual-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.visual-grid img{display:block;width:100%;border-radius:8px}.scene-table{width:100%;border-collapse:collapse;font-size:.9rem}.scene-table th,.scene-table td{padding:9px;border-bottom:1px solid #2a3a58;text-align:left;vertical-align:top}.scene-table th{color:#7dd3fc}.warning{color:#fbbf24}.score{font-size:2rem;color:#34d399}@media(max-width:700px){.grid,.content-grid,.visual-grid{grid-template-columns:1fr}header{align-items:flex-start;gap:12px;flex-direction:column}.scene-table{display:block;overflow-x:auto}}
  </style>
</head>
<body><main>
  <header><div class="brand">Ad<span>Forge</span></div><nav><a href="/docs">API docs</a> · <a href="/api/health">Health</a></nav></header>
  <section class="hero"><p class="muted">Grounded, audience-aware advertising packages from the facts you provide.</p>
    <h1>Turn product facts into a complete campaign.</h1>
    <div class="panel">
      <form id="form">
        <div class="grid"><div><label for="name">Product name</label><input id="name" required>
          <label for="category">Category</label><input id="category" required>
          <label for="brand">Brand name</label><input id="brand" required>
          <label for="tone">Brand tone</label><input id="tone" value="trustworthy" required>
          <label for="offer">Price or offer</label><input id="offer" placeholder="Optional"></div>
          <div><label for="features">Key features (one per line, 3-8)</label><textarea id="features" required></textarea>
            <label for="usp">Unique selling point</label><textarea id="usp" required></textarea>
            <label for="audience">Audience</label><select id="audience" disabled required></select></div></div>
        <button class="button" type="submit">Generate campaign</button><span id="status" class="status" aria-live="polite"></span>
      </form>
    </div>
  </section>
  <section id="results" class="panel" hidden><div id="score" class="score"></div><div class="tabs" role="tablist"></div><div id="output"></div>
    <div><button class="button secondary export" data-format="json">Export JSON</button><button class="button secondary export" data-format="markdown">Export Markdown</button><button class="button secondary export" data-format="zip">Campaign ZIP</button></div>
  </section>
</main>
<script>
const audience=document.querySelector("#audience"),status=document.querySelector("#status"),results=document.querySelector("#results"),output=document.querySelector("#output"),tabs=document.querySelector(".tabs");
let packages=[],active="product_descriptions";
async function loadAudiences(){try{const r=await fetch("/api/audiences");if(!r.ok)throw new Error("Could not load audiences");(await r.json()).forEach(a=>{const o=document.createElement("option");o.value=a.id;o.textContent=a.name;audience.append(o)});audience.disabled=false}catch(err){status.textContent=err.message}}
function card(title,...bodies){const el=document.createElement("article");el.className="content-card";const h=document.createElement("h3");h.textContent=title;el.append(h,...bodies);return el}
function paragraph(label,value){const wrap=document.createElement("div");const h=document.createElement("h4");h.textContent=label;const p=document.createElement("p");p.textContent=value||"Not supplied";wrap.append(h,p);return wrap}
function list(label,items){const wrap=document.createElement("div");const h=document.createElement("h4");h.textContent=label;const ul=document.createElement("ul");(items||[]).forEach(item=>{const li=document.createElement("li");li.textContent=typeof item==="string"?item:(item.text||JSON.stringify(item));ul.append(li)});wrap.append(h,ul);return wrap}
function renderDescriptions(value){const grid=document.createElement("div");grid.className="content-grid";grid.append(card("One-liner",paragraph("",value.one_liner)),card("Short description",paragraph("",value.short)),card("Long description",paragraph("",value.long)),card("SEO",paragraph("Title tag",value.seo_title),paragraph("Meta description",value.seo_meta_description)),card("Features",list("",value.feature_bullets)));return grid}
function renderPromotion(value){const grid=document.createElement("div");grid.className="content-grid";grid.append(card("Headlines",list("",value.headlines)),card("Taglines",list("",value.taglines)),card("Ad copy variants",list("",(value.ad_copy_variants||[]).map(x=>`${x.angle}: ${x.text}`))),card("Calls to action",list("",value.ctas)),card("Email",list("Subject lines",value.email_subject_lines),list("Preheaders",value.email_preheaders)),card("Google Ads",list("Headlines",value.google_ads?.headlines),list("Descriptions",value.google_ads?.descriptions)));return grid}
function renderSocial(value){const grid=document.createElement("div");grid.className="content-grid";grid.append(card("Instagram",paragraph("Caption",value.instagram?.caption),list("Hashtags",value.instagram?.hashtags),paragraph("Alt text",value.instagram?.alt_text)),card("Facebook",paragraph("Post",value.facebook?.post)),card("X / Twitter",paragraph("Post",value.x?.post),list("Thread",value.x?.thread)),card("LinkedIn",paragraph("Post",value.linkedin?.post)),card("TikTok / Reels",paragraph("Hook",value.tiktok_reels?.hook),paragraph("Caption",value.tiktok_reels?.caption)),card("7-day calendar",list("",(value.calendar||[]).map(x=>`Day ${x.day}: ${x.post_type} — ${x.timing} — ${x.goal}`))));return grid}
function renderVisuals(value){const grid=document.createElement("div");grid.className="content-grid";grid.append(card("Art direction",paragraph("",value.art_direction)),card("Palette and typography",list("Colors",value.color_palette),list("Typography",value.typography)),card("Hero concepts",list("",value.hero_concepts)),card("Poster layout",paragraph("",value.poster_layout)));const previews=document.createElement("article");previews.className="content-card";const h=document.createElement("h3");h.textContent="Local visual previews";previews.append(h);const visualGrid=document.createElement("div");visualGrid.className="visual-grid";(value.svg_previews||[]).forEach(svg=>{const img=document.createElement("img");img.alt="AdForge visual preview";img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);visualGrid.append(img)});previews.append(visualGrid);grid.append(previews);return grid}
function renderVideo(value){const wrap=document.createElement("div");["script_15s","script_30s","script_60s"].forEach(name=>{const section=document.createElement("article");section.className="content-card";const h=document.createElement("h3");h.textContent=name.replace("script_","")+" script";const table=document.createElement("table");table.className="scene-table";table.innerHTML="<thead><tr><th>Time</th><th>Visual</th><th>Voiceover</th><th>On-screen text</th><th>Music / SFX</th></tr></thead>";const body=document.createElement("tbody");(value[name]||[]).forEach(scene=>{const row=document.createElement("tr");["timestamp","visual","voiceover","on_screen_text","music_sfx"].forEach(key=>{const cell=document.createElement("td");cell.textContent=scene[key]||"";row.append(cell)});body.append(row)});table.append(body);section.append(h,table);wrap.append(section)}wrap.append(card("SSML export",paragraph("",value.ssml)));return wrap}
function renderSection(name,value){if(name==="product_descriptions")return renderDescriptions(value);if(name==="promotional_text")return renderPromotion(value);if(name==="social_media")return renderSocial(value);if(name==="visual_concepts")return renderVisuals(value);return renderVideo(value)}
function show(){const p=packages[0];document.querySelector("#score").textContent=`Quality score: ${p.quality_score ?? "n/a"}/100`;const sections=["product_descriptions","promotional_text","social_media","visual_concepts","video_narration"];tabs.replaceChildren(...sections.map(s=>{const b=document.createElement("button");b.className=`tab ${s===active?"active":""}`;b.textContent=s.replaceAll("_"," ");b.onclick=()=>{active=s;show()};return b}));output.replaceChildren(renderSection(active,p[active]));results.hidden=false}
document.querySelector("#form").onsubmit=async e=>{e.preventDefault();status.textContent="Generating…";const v=id=>document.querySelector("#"+id).value;const body={product:{name:v("name").trim(),category:v("category").trim(),key_features:v("features").split("\n").map(x=>x.trim()).filter(Boolean),price_offer:v("offer").trim()||null,unique_selling_point:v("usp").trim(),brand_name:v("brand").trim(),brand_tone:v("tone").trim().toLowerCase(),language:"English"},audiences:[{preset:audience.value}]};try{const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok){const error=await r.json();const details=Array.isArray(error.details)?error.details.map(x=>`${x.loc?.join(".")||"request"}: ${x.msg}`).join("; "):"";throw new Error(`${error.message||"Generation failed"}${details?` ${details}`:""}`)}packages=await r.json();status.textContent="Ready";show()}catch(err){status.textContent=err.message}};
document.querySelectorAll(".export").forEach(b=>b.onclick=async()=>{if(!packages.length)return;const v=id=>document.querySelector("#"+id).value;const body={product:{name:v("name"),category:v("category"),key_features:v("features").split("\n").map(x=>x.trim()).filter(Boolean),price_offer:v("offer")||null,unique_selling_point:v("usp"),brand_name:v("brand"),brand_tone:v("tone"),language:"English"},audiences:[{preset:audience.value}]};const r=await fetch(`/api/export/${b.dataset.format}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const blob=await r.blob(),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`adforge-${b.dataset.format}`;a.click()});
loadAudiences();
</script></body></html>
