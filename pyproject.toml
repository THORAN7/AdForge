[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adforge"
version = "0.1.0"
description = "AI-based product advertisement generator."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "AdForge Contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
urls = {Homepage = "https://github.com/THORAN7/adforge", Repository = "https://github.com/THORAN7/adforge"}
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.16.2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]
documents = ["python-docx>=1.1,<2", "reportlab>=4,<5"]

[project.scripts]
adforge = "adforge.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adforge = ["py.typed", "static/*.html"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["adforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=adforge --cov-report=term-missing --cov-fail-under=85"
