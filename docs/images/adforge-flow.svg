<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">AdForge Studio campaign flow</title>
  <desc id="desc">Product facts flow through audience adaptation into a complete campaign package.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#e7eefb}
    .box{fill:#121d33;stroke:#7dd3fc;stroke-width:2}
    .label{font-size:20px;font-weight:700}
    .small{fill:#a9b8d2;font-size:13px}
    .arrow{stroke:#7dd3fc;stroke-width:3;stroke-linecap:round}
    .pulse{fill:#34d399}
  </style>
  <rect width="960" height="220" rx="20" fill="#0b1020"/>
  <rect class="box" x="30" y="65" width="190" height="90" rx="14"/>
  <text class="label" x="125" y="102" text-anchor="middle">Product facts</text>
  <text class="small" x="125" y="128" text-anchor="middle">Grounded input</text>
  <path class="arrow" d="M235 110h85"/><path class="arrow" d="M535 110h85"/><path class="arrow" d="M770 110h85"/>
  <circle class="pulse" cx="265" cy="110" r="6"><animate attributeName="cx" values="235;315;235" dur="2s" repeatCount="indefinite"/></circle>
  <rect class="box" x="325" y="65" width="210" height="90" rx="14"/>
  <text class="label" x="430" y="102" text-anchor="middle">Audience adapter</text>
  <text class="small" x="430" y="128" text-anchor="middle">Message + channel strategy</text>
  <circle class="pulse" cx="565" cy="110" r="6"><animate attributeName="cx" values="535;615;535" dur="2s" repeatCount="indefinite"/></circle>
  <rect class="box" x="625" y="65" width="145" height="90" rx="14"/>
  <text class="label" x="697" y="102" text-anchor="middle">Writers</text>
  <text class="small" x="697" y="128" text-anchor="middle">Five sections</text>
  <circle class="pulse" cx="800" cy="110" r="6"><animate attributeName="cx" values="770;855;770" dur="2s" repeatCount="indefinite"/></circle>
  <rect class="box" x="860" y="65" width="75" height="90" rx="14"/>
  <text class="label" x="897" y="102" text-anchor="middle">Kit</text>
  <text class="small" x="897" y="128" text-anchor="middle">Review</text>
</svg>
